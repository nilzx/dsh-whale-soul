name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['22.x', '24.x']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install the supported host for persona startup tests
        run: npm install --prefix "${{ runner.temp }}/whale-host" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.3

      - name: Run tests
        run: npm test
        env:
          DSH_RUNTIME_MODULES: ${{ runner.temp }}/whale-host/node_modules

      - name: Inspect the package contents
        run: npm run pack:check
