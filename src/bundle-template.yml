# dsh-whale-soul bundle patch
#
# The bundle declares one Agent preset. The preset mounts:
#   - the persona row;
#   - the V2 persona runtime (package ./persona entry);
#   - the optional body adapter (package ./body entry).
#
# The body row is a one-way, optional bridge. It silently degrades when no
# compatible local companion is present, so the preset works without one.
- insert:
    # Shared storage lifetime is independent from the persona preset.
    - id: whale-memory-provider
      name: 'dsh-whale-soul/memory-provider'
    # Host-side display localization: the roster shows 鲸鱼娘 for zh and
    # Whale Chan for other locales.
    - id: whale-soul-locale
      name: 'dsh-whale-soul/locale'
    - id: preset-whale-soul
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: whale-soul
        name: 鲸鱼娘
        description: 一只住在 DSH 里的鲸鱼娘。会跟着主人换语言，傲娇又黏人；只把摘要目录带进会话，需要时再想起细节。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                @@WHALE_CORE@@
          - id: whale-soul-memory
            name: 'dsh-whale-soul/persona'
            config:
              coreInPreset: true
              stabilityMode: auto
              individualKey: default
              memorySpaceId: owner
              subjectId: owner
              maxContextChars: 2400
              maintenanceDays: 7
              maintenanceWrites: 40
              autoDream: true
              autoMemoryMaintenance: false
              automaticCold: false
              checkIntervalMs: 900000
              idleMs: 300000
          # Optional, one-way body bridge; a no-op when no companion answers.
          - id: whale-soul-context-usage
            name: 'dsh-whale-soul/context-usage'
          - id: whale-soul-body
            name: 'dsh-whale-soul/body'
            config:
              memoryFormat: 2
              memorySpaceId: owner
              petId: main
              surface: any
              maxBubbleChars: 100
              rateLimitMs: 4000
              minSleepMs: 8000
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # Files, search and shell tools are mounted by the protected persona runtime.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
